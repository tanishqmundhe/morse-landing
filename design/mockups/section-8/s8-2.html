<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=Geist+Mono:wght@500;600&display=block" rel="stylesheet">
<style>
:root{--sunken:oklch(0.165 0.008 52);--canvas:oklch(0.142 0.008 55);--raised:oklch(0.205 0.01 50);--float:oklch(0.25 0.008 55);--overlay:oklch(0.28 0.01 52);--overlay-h:oklch(0.315 0.011 52);--ink:oklch(0.9564 0.0127 63.92);--soft:oklch(0.72 0.028 56);--faint:oklch(0.66 0.033 55);--hair:oklch(0.3 0.012 50);--signal:oklch(0.78 0.125 36);--action:#a9be8c;--action-fg:#1a2112;
--raise:0 0 0 1px oklch(0.9564 0.0127 63.92/.04),0 1px 2px oklch(0.06 0.006 50/.3),0 10px 28px -16px oklch(0.06 0.006 50/.5);
--floatsh:0 0 0 1px oklch(0.9564 0.0127 63.92/.07),0 18px 44px -14px oklch(0.06 0.006 50/.7)}
*{box-sizing:border-box;margin:0}
body{background:var(--canvas);color:var(--ink);font:400 18px/1.55 "IBM Plex Sans",sans-serif;-webkit-font-smoothing:antialiased;}
.mono{font-family:"Geist Mono",monospace}
.btn{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 24px;border-radius:999px;font-size:17px;font-weight:500;white-space:nowrap}
.pri{background:var(--action);color:var(--action-fg)}
.sec{background:var(--overlay);color:var(--ink)}
.ghost{color:var(--soft)}
h1{font-weight:300;letter-spacing:-.03em;line-height:1.02}
h1 span{color:var(--soft)}
.nav a{color:var(--soft);font-size:16px;text-decoration:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--signal);box-shadow:0 0 0 4px oklch(0.78 0.125 36/.18)}
.film{background-size:cover;background-position:center}
.tag{font-family:"Geist Mono",monospace;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;font-weight:600}
</style><style>
.h2{font-weight:300;line-height:1.04;letter-spacing:-.035em}
.h2 span{color:var(--soft)}
.lead{font-size:19px;color:var(--soft);line-height:1.55}
.foot{font-size:15px;color:var(--faint)}
.foot a{color:var(--soft);text-decoration:none;margin-left:28px}
</style></head><body>
<section style="padding:170px 60px 90px;text-align:center">
  <img src="mark.svg" style="height:44px;opacity:.8">
  <h2 class="h2" style="font-size:66px;margin-top:28px">Less meeting admin.<br><span>More meeting of minds.</span></h2>
  <p class="lead" style="max-width:520px;margin:22px auto 0">Google sign-in, your calendar connected, and your first meeting in a minute.</p>
  <div style="margin-top:36px"><span class="btn pri" style="height:52px;font-size:17px;padding:0 28px">Open Morse <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="flex:none"><path d="M9.00005 6C9.00005 6 15 10.4189 15 12C15 13.5812 9 18 9 18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg></span></div>
</section>
<footer style="padding:40px 44px 0">
  <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:30px;padding-bottom:26px">
    <nav class="foot" style="margin-left:-28px"><a>Product</a><a>Features</a><a>Booking</a><a>Questions</a></nav>
    <span style="display:flex;align-items:center;gap:10px" class="foot">A product by <img src="um.svg" style="height:26px;opacity:.8"></span>
  </div>
  <img src="logo.svg" style="width:100%;opacity:.1;display:block">
</footer></body></html>
