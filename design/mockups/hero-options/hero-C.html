<!doctype html><html><head><meta charset="utf-8"><title>C</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=Geist+Mono:wght@500;600&display=block" rel="stylesheet">
<style>
:root{--sunken:oklch(0.165 0.008 52);--canvas:oklch(0.142 0.008 55);--raised:oklch(0.205 0.01 50);--float:oklch(0.25 0.008 55);--overlay:oklch(0.28 0.01 52);--overlay-h:oklch(0.315 0.011 52);--ink:oklch(0.9564 0.0127 63.92);--soft:oklch(0.72 0.028 56);--faint:oklch(0.66 0.033 55);--hair:oklch(0.3 0.012 50);--signal:oklch(0.78 0.125 36);--action:#a9be8c;--action-fg:#1a2112;
--raise:0 0 0 1px oklch(0.9564 0.0127 63.92/.04),0 1px 2px oklch(0.06 0.006 50/.3),0 10px 28px -16px oklch(0.06 0.006 50/.5);
--floatsh:0 0 0 1px oklch(0.9564 0.0127 63.92/.07),0 18px 44px -14px oklch(0.06 0.006 50/.7)}
*{box-sizing:border-box;margin:0}
body{background:var(--canvas);color:var(--ink);font:400 18px/1.55 "IBM Plex Sans",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.mono{font-family:"Geist Mono",monospace}
.btn{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 24px;border-radius:999px;font-size:17px;font-weight:500;white-space:nowrap}
.pri{background:var(--action);color:var(--action-fg)}
.sec{background:var(--overlay);color:var(--ink)}
.ghost{color:var(--soft)}
h1{font-weight:300;letter-spacing:-.03em;line-height:1.02}
h1 span{color:var(--soft)}
.nav a{color:var(--soft);font-size:16px;text-decoration:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--signal);box-shadow:0 0 0 4px oklch(0.78 0.125 36/.18)}
.film{background-size:cover;background-position:center}
.tag{font-family:"Geist Mono",monospace;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;font-weight:600}
</style><style></style></head><body>
<header class="nav" style="position:absolute;top:22px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:28px;padding:8px 8px 8px 22px;border-radius:999px;background:var(--raised);box-shadow:var(--raise)">
  <img src="mark.svg" style="height:26px"><nav style="display:flex;gap:26px"><a>Product</a><a>Teleprompter</a><a>Booking</a><a>Questions</a></nav><span class="btn pri" style="height:40px;padding:0 18px;font-size:16px">Open Morse</span>
</header>
<section style="text-align:center;padding-top:150px">
  <h1 style="font-size:84px">Good conversations.<br><span>Real progress.</span></h1>
  <p style="margin:24px auto 0;font-size:20px;color:var(--soft);max-width:600px">A video meeting app that takes its own notes, answers from what you know, and books the follow-up.</p>
  <div style="display:flex;gap:14px;margin-top:34px;justify-content:center"><span class="btn pri">Open Morse <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="flex:none"><path d="M9.00005 6C9.00005 6 15 10.4189 15 12C15 13.5812 9 18 9 18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg></span><span class="btn sec">See how it works</span></div>
</section>
<div style="position:absolute;left:0;right:0;bottom:-6px;display:flex;justify-content:center;align-items:flex-end;gap:14px">
  <div style="position:relative;width:210px;height:240px;border-radius:24px;overflow:hidden;box-shadow:var(--raise);opacity:.7">
    <div class="film" style="position:absolute;inset:0;background-image:url(grass.jpg)"></div>
    <span style="position:absolute;left:12px;bottom:52px;display:flex;align-items:center;gap:8px;padding:4px 12px 4px 8px;border-radius:999px;background:oklch(0.142 0.008 55/.7);font-size:14px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="flex:none"><path d="M7 6.5C7 4.01472 9.01472 2 11.5 2C13.9853 2 16 4.01472 16 6.5V11.5C16 13.9853 13.9853 16 11.5 16C9.01472 16 7 13.9853 7 11.5V6.5Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/><path d="M11.5 19H11.0828C7.57267 19 4.57706 16.4623 4 13M11.5 19H11.9172C15.4273 19 18.4229 16.4623 19 13M11.5 19V22" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/></svg> Jamie</span>
    
  </div><div style="position:relative;width:250px;height:240px;border-radius:24px;overflow:hidden;box-shadow:var(--raise);opacity:.7">
    <div class="film" style="position:absolute;inset:0;background-image:url(desk.jpg)"></div>
    <span style="position:absolute;left:12px;bottom:52px;display:flex;align-items:center;gap:8px;padding:4px 12px 4px 8px;border-radius:999px;background:oklch(0.142 0.008 55/.7);font-size:14px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="flex:none"><path d="M7 6.5C7 4.01472 9.01472 2 11.5 2C13.9853 2 16 4.01472 16 6.5V11.5C16 13.9853 13.9853 16 11.5 16C9.01472 16 7 13.9853 7 11.5V6.5Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/><path d="M11.5 19H11.0828C7.57267 19 4.57706 16.4623 4 13M11.5 19H11.9172C15.4273 19 18.4229 16.4623 19 13M11.5 19V22" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/></svg> Sofia</span>
    
  </div><div style="position:relative;width:420px;height:330px;border-radius:24px;overflow:hidden;box-shadow:var(--raise);">
    <div class="film" style="position:absolute;inset:0;background-image:url(signal.jpg)"></div>
    <span style="position:absolute;left:12px;bottom:70px;display:flex;align-items:center;gap:8px;padding:4px 12px 4px 8px;border-radius:999px;background:oklch(0.142 0.008 55/.7);font-size:14px"><i class="dot" style="background:var(--action);box-shadow:0 0 0 4px #a9be8c33"></i> Priya</span>
    <div style="position:absolute;left:12px;right:12px;bottom:14px;padding:9px 14px;border-radius:14px;background:oklch(0.142 0.008 55/.78);font-size:15px;text-align:left">Let’s pick this up on Thursday at two.</div>
  </div><div style="position:relative;width:250px;height:240px;border-radius:24px;overflow:hidden;box-shadow:var(--raise);opacity:.7">
    <div class="film" style="position:absolute;inset:0;background-image:url(meadow.jpg)"></div>
    <span style="position:absolute;left:12px;bottom:52px;display:flex;align-items:center;gap:8px;padding:4px 12px 4px 8px;border-radius:999px;background:oklch(0.142 0.008 55/.7);font-size:14px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="flex:none"><path d="M7 6.5C7 4.01472 9.01472 2 11.5 2C13.9853 2 16 4.01472 16 6.5V11.5C16 13.9853 13.9853 16 11.5 16C9.01472 16 7 13.9853 7 11.5V6.5Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/><path d="M11.5 19H11.0828C7.57267 19 4.57706 16.4623 4 13M11.5 19H11.9172C15.4273 19 18.4229 16.4623 19 13M11.5 19V22" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/></svg> Daniel</span>
    
  </div><div style="position:relative;width:210px;height:240px;border-radius:24px;overflow:hidden;box-shadow:var(--raise);opacity:.7">
    <div class="film" style="position:absolute;inset:0;background-image:url(postbox.jpg)"></div>
    <span style="position:absolute;left:12px;bottom:52px;display:flex;align-items:center;gap:8px;padding:4px 12px 4px 8px;border-radius:999px;background:oklch(0.142 0.008 55/.7);font-size:14px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="flex:none"><path d="M7 6.5C7 4.01472 9.01472 2 11.5 2C13.9853 2 16 4.01472 16 6.5V11.5C16 13.9853 13.9853 16 11.5 16C9.01472 16 7 13.9853 7 11.5V6.5Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/><path d="M11.5 19H11.0828C7.57267 19 4.57706 16.4623 4 13M11.5 19H11.9172C15.4273 19 18.4229 16.4623 19 13M11.5 19V22" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/></svg> Arjun</span>
    
  </div>
</div>
<div style="position:absolute;left:0;right:0;bottom:0;height:40px;background:linear-gradient(transparent,var(--canvas))"></div>
</body></html>
