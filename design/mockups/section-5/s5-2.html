<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=Geist+Mono:wght@500;600&display=block" rel="stylesheet">
<style>
:root{--sunken:oklch(0.165 0.008 52);--canvas:oklch(0.142 0.008 55);--raised:oklch(0.205 0.01 50);--float:oklch(0.25 0.008 55);--overlay:oklch(0.28 0.01 52);--overlay-h:oklch(0.315 0.011 52);--ink:oklch(0.9564 0.0127 63.92);--soft:oklch(0.72 0.028 56);--faint:oklch(0.66 0.033 55);--hair:oklch(0.3 0.012 50);--signal:oklch(0.78 0.125 36);--action:#a9be8c;--action-fg:#1a2112;
--raise:0 0 0 1px oklch(0.9564 0.0127 63.92/.04),0 1px 2px oklch(0.06 0.006 50/.3),0 10px 28px -16px oklch(0.06 0.006 50/.5);
--floatsh:0 0 0 1px oklch(0.9564 0.0127 63.92/.07),0 18px 44px -14px oklch(0.06 0.006 50/.7)}
*{box-sizing:border-box;margin:0}
body{background:var(--canvas);color:var(--ink);font:400 18px/1.55 "IBM Plex Sans",sans-serif;-webkit-font-smoothing:antialiased;}
.mono{font-family:"Geist Mono",monospace}
.btn{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 24px;border-radius:999px;font-size:17px;font-weight:500;white-space:nowrap}
.pri{background:var(--action);color:var(--action-fg)}
.sec{background:var(--overlay);color:var(--ink)}
.ghost{color:var(--soft)}
h1{font-weight:300;letter-spacing:-.03em;line-height:1.02}
h1 span{color:var(--soft)}
.nav a{color:var(--soft);font-size:16px;text-decoration:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--signal);box-shadow:0 0 0 4px oklch(0.78 0.125 36/.18)}
.film{background-size:cover;background-position:center}
.tag{font-family:"Geist Mono",monospace;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;font-weight:600}
</style><style>
.h2{font-weight:300;font-size:60px;line-height:1.05;letter-spacing:-.03em}
.h2 span{color:var(--soft)}
.lead{font-size:20px;color:var(--soft);line-height:1.55}
.ava{display:inline-block;flex:none;border-radius:50%;background-size:cover;background-position:center}
.tile{position:relative;border-radius:22px;overflow:hidden;background-size:cover;background-position:center}
.name{position:absolute;left:12px;bottom:12px;padding:4px 12px;border-radius:999px;background:oklch(0.142 0.008 55/.72);font-size:14px;display:flex;gap:6px;align-items:center}
.pane{background:var(--raised);border-radius:26px;box-shadow:var(--raise)}
.sunk{background:var(--sunken);box-shadow:inset 0 1px 2px oklch(0.06 0.006 50/.45),inset 0 0 0 1px oklch(0.9564 0.0127 63.92/.04);border-radius:18px}
.tag{font-family:"Geist Mono",monospace;font-size:13px;letter-spacing:1.6px;text-transform:uppercase;font-weight:600;color:var(--faint)}
@keyframes seat{0%{opacity:0;transform:translateY(16px) scale(.96);filter:blur(6px)}100%{opacity:1;transform:none;filter:none}}
@keyframes dash{to{stroke-dashoffset:0}}
@keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes bgc{0%{opacity:0}4%,18%{opacity:1}22%,100%{opacity:0}}
@keyframes lab{0%{opacity:0;transform:translateY(6px)}4%,18%{opacity:1;transform:none}22%,100%{opacity:0}}
@keyframes tick{0%,55%{opacity:0;transform:scale(.4)}62%,100%{opacity:1;transform:scale(1)}}
@keyframes strike{0%,55%{width:0}66%,100%{width:100%}}
@keyframes drop{0%,40%{opacity:0;transform:translateY(-16px) scale(.97)}48%,100%{opacity:1;transform:none}}
@keyframes cardin{0%,15%{opacity:0;transform:translateY(14px)}24%,100%{opacity:1;transform:none}}
</style></head><body>
<section style="padding:150px 100px;text-align:center">
  <h2 class="h2">Your room.<br><span>Your light.</span></h2>
  <p class="lead" style="max-width:600px;margin:22px auto 0">Where you appear to be, how your camera looks, and the colour of your Morse. Everyone in the call sees the room you chose.</p>
  <div style="position:relative;height:620px;border-radius:34px;overflow:hidden;margin-top:64px;box-shadow:var(--floatsh);max-width:1040px;margin-left:auto;margin-right:auto">
    <div style="position:absolute;inset:0;background:url(a/sunlit-room.webp) center/cover;filter:sepia(.22) saturate(1.08);opacity:0;animation:bgc 20s 0s infinite"></div><div style="position:absolute;inset:0;background:url(a/lake-sunrise.webp) center/cover;filter:contrast(1.1) saturate(.82) sepia(.12);opacity:0;animation:bgc 20s 4s infinite"></div><div style="position:absolute;inset:0;background:url(a/reading-nook.webp) center/cover;filter:hue-rotate(-10deg) brightness(1.03);opacity:0;animation:bgc 20s 8s infinite"></div><div style="position:absolute;inset:0;background:url(a/night-bloom.webp) center/cover;filter:saturate(1.4);opacity:0;animation:bgc 20s 12s infinite"></div><div style="position:absolute;inset:0;background:url(a/snowy-cabin.webp) center/cover;filter:grayscale(1) contrast(1.06);opacity:0;animation:bgc 20s 16s infinite"></div>
    <div style="position:absolute;inset:0;background:radial-gradient(70% 70% at 50% 45%,transparent,oklch(0.142 0.008 55/.4))"></div>
    <span style="position:absolute;left:50%;top:47%;transform:translate(-50%,-50%)"><span class="ava" style="width:150px;height:150px;background-image:url(a/neuralarc-avatar-sage-512.webp)"></span></span>
    <span class="name" style="left:24px;bottom:24px;font-size:17px;padding:8px 18px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="flex:none"><path d="M7 6.5C7 4.01472 9.01472 2 11.5 2C13.9853 2 16 4.01472 16 6.5V11.5C16 13.9853 13.9853 16 11.5 16C9.01472 16 7 13.9853 7 11.5V6.5Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/><path d="M11.5 19H11.0828C7.57267 19 4.57706 16.4623 4 13M11.5 19H11.9172C15.4273 19 18.4229 16.4623 19 13M11.5 19V22" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/></svg> You</span>
    <div style="position:absolute;right:24px;top:24px;display:grid;padding:9px 20px;border-radius:999px;background:oklch(0.142 0.008 55/.78);font-size:16px">
      <span style="grid-area:1/1;opacity:0;animation:lab 20s 0s infinite">Style · Warm</span><span style="grid-area:1/1;opacity:0;animation:lab 20s 4s infinite">Style · Film</span><span style="grid-area:1/1;opacity:0;animation:lab 20s 8s infinite">Style · Cool</span><span style="grid-area:1/1;opacity:0;animation:lab 20s 12s infinite">Style · Vivid</span><span style="grid-area:1/1;opacity:0;animation:lab 20s 16s infinite">Style · Mono</span>
    </div>
    <div style="position:absolute;left:50%;bottom:28px;transform:translateX(-50%);display:flex;align-items:center;gap:20px;padding:10px 12px 10px 22px;border-radius:999px;background:oklch(0.142 0.008 55/.82)">
      <div style="display:flex;gap:14px"><span style="width:30px;height:30px;border-radius:50%;background:#a9be8c;box-shadow:0 0 0 2px oklch(0.142 0.008 55),0 0 0 4px #F7EFE8"></span><span style="width:30px;height:30px;border-radius:50%;background:#6ec3b4;box-shadow:none"></span><span style="width:30px;height:30px;border-radius:50%;background:#94b6d2;box-shadow:none"></span><span style="width:30px;height:30px;border-radius:50%;background:#b3b4d6;box-shadow:none"></span><span style="width:30px;height:30px;border-radius:50%;background:#cc98be;box-shadow:none"></span></div>
      <span style="display:flex;align-items:center;gap:8px;height:44px;padding:0 20px;border-radius:999px;font-size:16px;font-weight:500;background:#a9be8c;color:#1a2112">+ New meeting</span>
    </div>
  </div>
  <div style="display:flex;justify-content:center;gap:52px;margin-top:40px;color:var(--soft);font-size:17px">
    <span>16 backgrounds in four sets</span><span>7 camera styles</span><span>5 accents</span><span>Light or dark</span>
  </div>
</section></body></html>
